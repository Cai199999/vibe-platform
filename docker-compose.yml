# ============================================================
# vibe-platform 本地开发编排
#
# 只编排平台自身服务：
#   - platform-web : React/Vite 画布，宿主 5173，/api 代理到 java-bff
#   - java-bff     : Spring Boot BFF，宿主 8080
#   - python-ai    : FastAPI AI Core，宿主 8100
#
# MySQL / Redis / MinIO 复用 ~/Workspace/infra 中已有的容器，
# 本文件绝对不重复部署这些中间件。
# ============================================================

name: vibe-platform

services:
  python-ai:
    build:
      context: ./services/orchestrator
      dockerfile: Dockerfile
    image: vibe-platform/python-ai:dev
    container_name: vibe-python-ai
    environment:
      APP_ENV: ${APP_ENV:-local}
      SERVICE_NAME: python-ai
      SERVICE_VERSION: 0.1.0
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
      # Token 成本优化：能力分级 + 任务级覆盖 + 历史压缩 + 错误截断。
      MODEL_FAST_NAME: ${MODEL_FAST_NAME:-deepseek-chat}
      MODEL_STRONG_NAME: ${MODEL_STRONG_NAME:-deepseek-chat}
      MODEL_FAST_TEMPERATURE: ${MODEL_FAST_TEMPERATURE:-0.0}
      MODEL_STRONG_TEMPERATURE: ${MODEL_STRONG_TEMPERATURE:-0.2}
      MODEL_ROUTING_NAME: ${MODEL_ROUTING_NAME:-}
      MODEL_VALIDATION_NAME: ${MODEL_VALIDATION_NAME:-}
      MODEL_SUMMARY_NAME: ${MODEL_SUMMARY_NAME:-}
      MODEL_PLANNER_NAME: ${MODEL_PLANNER_NAME:-}
      MODEL_CODER_NAME: ${MODEL_CODER_NAME:-}
      MODEL_ARCHITECT_ANALYZE_NAME: ${MODEL_ARCHITECT_ANALYZE_NAME:-}
      MODEL_ARCHITECT_CONTRACT_NAME: ${MODEL_ARCHITECT_CONTRACT_NAME:-}
      HISTORY_SUMMARY_TOKEN_THRESHOLD: ${HISTORY_SUMMARY_TOKEN_THRESHOLD:-3000}
      HISTORY_SUMMARY_MAX_CHARS: ${HISTORY_SUMMARY_MAX_CHARS:-200}
      ERROR_CONTEXT_LINES: ${ERROR_CONTEXT_LINES:-10}
      ERROR_CONTEXT_MAX_CHARS: ${ERROR_CONTEXT_MAX_CHARS:-2000}
      REDIS_HOST: ${REDIS_HOST:-host.docker.internal}
      REDIS_PORT: ${REDIS_PORT:-6379}
      # Sandbox：通过挂载的 Docker Socket 在宿主机创建隔离容器。
      SANDBOX_IMAGE: ${SANDBOX_IMAGE:-vibe-platform/sandbox-react:dev}
      SANDBOX_PREVIEW_HOST: ${SANDBOX_PREVIEW_HOST:-127.0.0.1}
      SANDBOX_MEMORY_MB: ${SANDBOX_MEMORY_MB:-768}
      SANDBOX_CPU_LIMIT: ${SANDBOX_CPU_LIMIT:-1.0}
      SANDBOX_START_TIMEOUT_SECONDS: ${SANDBOX_START_TIMEOUT_SECONDS:-90}
      SANDBOX_VERIFY_TIMEOUT_SECONDS: ${SANDBOX_VERIFY_TIMEOUT_SECONDS:-180}
      # 企业 CustomAgent Manifest 目录；只加载 JSON，不执行代码。
      SUPERVISOR_CUSTOM_AGENTS_DIR: ${SUPERVISOR_CUSTOM_AGENTS_DIR:-config/custom_agents}
      # M3 Agent 扩展：外部 Skill 目录、shell 工具开关、MCP Server 列表。
      SKILLS_DIR: ${SKILLS_DIR:-config/skills}
      TOOL_SHELL_ENABLED: ${TOOL_SHELL_ENABLED:-false}
      TOOL_SHELL_WORKDIR: ${TOOL_SHELL_WORKDIR:-/tmp/vibe-toolbox}
      TOOL_SHELL_TIMEOUT_SECONDS: ${TOOL_SHELL_TIMEOUT_SECONDS:-10}
      TOOL_SHELL_MAX_OUTPUT_CHARS: ${TOOL_SHELL_MAX_OUTPUT_CHARS:-20000}
      MCP_SERVERS: ${MCP_SERVERS:-[]}
      # 图片导入视觉模型（OpenAI 兼容多模态）；留空则使用确定性占位页。
      VISION_API_KEY: ${VISION_API_KEY:-}
      VISION_BASE_URL: ${VISION_BASE_URL:-https://api.openai.com/v1}
      VISION_MODEL: ${VISION_MODEL:-gpt-4o}
      VISION_TIMEOUT_SECONDS: ${VISION_TIMEOUT_SECONDS:-90}
      VISION_MAX_IMAGE_SIDE: ${VISION_MAX_IMAGE_SIDE:-1600}
      # 导入包限制。
      IMPORT_MAX_ARCHIVE_BYTES: ${IMPORT_MAX_ARCHIVE_BYTES:-33554432}
      IMPORT_MAX_IMAGE_BYTES: ${IMPORT_MAX_IMAGE_BYTES:-12582912}
      IMPORT_MAX_UNCOMPRESSED_BYTES: ${IMPORT_MAX_UNCOMPRESSED_BYTES:-134217728}
      IMPORT_MAX_ENTRIES: ${IMPORT_MAX_ENTRIES:-4000}
      SANDBOX_IMPORT_TIMEOUT_SECONDS: ${SANDBOX_IMPORT_TIMEOUT_SECONDS:-300}
    ports:
      - "8100:8100"
    volumes:
      # M1 本地开发：直接复用宿主机 Docker Daemon 创建沙盒容器。
      # 安全注意：Docker Socket 等价于宿主 root 权限，仅限本地受信任环境。
      # 生产环境替换为独立沙盒节点 / gVisor，禁止业务容器直接挂载。
      - /var/run/docker.sock:/var/run/docker.sock
    group_add:
      # 宿主 docker 组 GID，Linux 上用 `stat -c '%g' /var/run/docker.sock` 获取。
      - "${DOCKER_GID:-115}"
    extra_hosts:
      # 让容器通过 host.docker.internal 访问宿主机上已有的中间件。
      - "host.docker.internal:host-gateway"
    networks:
      - vibe-platform-net
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/api/v1/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  java-bff:
    build:
      context: ./apps/platform-bff
      dockerfile: Dockerfile
    image: vibe-platform/java-bff:dev
    container_name: vibe-java-bff
    environment:
      SERVER_PORT: 8080
      APP_ENV: ${APP_ENV:-local}

      # 宿主机已有 Docker MySQL / Redis / MinIO
      MYSQL_HOST: ${MYSQL_HOST:-host.docker.internal}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-geo_ai_db}
      MYSQL_USER: ${MYSQL_USER:-root}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-root}

      REDIS_HOST: ${REDIS_HOST:-host.docker.internal}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}

      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://host.docker.internal:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-admin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-admin123}
      MINIO_BUCKET: ${MINIO_BUCKET:-vibe-platform}
      MINIO_SECURE: ${MINIO_SECURE:-false}

      # 同一自定义网络内，直接用服务名通信；证明跨语言调用。
      AI_CORE_BASE_URL: http://python-ai:8100
      AI_CORE_CONNECT_TIMEOUT_MS: 2000
      AI_CORE_READ_TIMEOUT_MS: 3000
      # Run 是同步长请求：模型 + 沙盒构建 + 最多 3 次修复。
      AI_CORE_RUN_CONNECT_TIMEOUT_MS: 2000
      AI_CORE_RUN_READ_TIMEOUT_MS: ${AI_CORE_RUN_READ_TIMEOUT_MS:-300000}
    ports:
      - "8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - vibe-platform-net
    depends_on:
      python-ai:
        condition: service_healthy
    healthcheck:
      # 该端点会继续调用 python-ai/internal/ping，因此这是端到端健康检查。
      test:
        - CMD-SHELL
        - "curl -fsS http://127.0.0.1:8080/api/v1/health >/dev/null || exit 1"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 40s

  platform-web:
    build:
      context: ./apps/platform-web
      dockerfile: Dockerfile
    image: vibe-platform/platform-web:dev
    container_name: vibe-platform-web
    environment:
      # 浏览器同源请求 /api，由 Vite 代理到容器内的 Java BFF。
      VITE_BFF_PROXY_TARGET: http://java-bff:8080
    ports:
      - "5173:5173"
    volumes:
      # 开发模式：源码挂载以启用 Vite HMR；node_modules 使用匿名卷，
      # 避免宿主（或空目录）覆盖镜像内已安装的依赖。
      - ./apps/platform-web:/app
      - /app/node_modules
    networks:
      - vibe-platform-net
    depends_on:
      java-bff:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - "wget -q -O /dev/null http://127.0.0.1:5173/ || exit 1"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

networks:
  vibe-platform-net:
    name: vibe-platform-net
    driver: bridge
