server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  # 显式声明容量：默认 200 线程 + 100 排队。真正的保护在
  # ai-core.resilience（舱壁/熔断），这里只是避免隐式默认值漂移。
  tomcat:
    threads:
      max: ${SERVER_TOMCAT_MAX_THREADS:200}
      min-spare: ${SERVER_TOMCAT_MIN_SPARE:20}
    accept-count: ${SERVER_TOMCAT_ACCEPT_COUNT:200}
    max-connections: ${SERVER_TOMCAT_MAX_CONNECTIONS:8192}

vibe:
  oidc:
    # 默认关闭：沿用 Mock 鉴权；生产启用后要求 Bearer JWT。
    enabled: ${VIBE_OIDC_ENABLED:false}
    issuer-uri: ${VIBE_OIDC_ISSUER_URI:}
    jwk-set-uri: ${VIBE_OIDC_JWK_SET_URI:}

spring:
  application:
    name: java-bff
  lifecycle:
    timeout-per-shutdown-phase: 20s

  # 复用 ~/Workspace/infra 的 MySQL，不在 Compose 中重复部署。
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:host.docker.internal}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:geo_ai_db}?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: vibe-bff-pool
      maximum-pool-size: 10
      minimum-idle: 1
      connection-timeout: 3000
      validation-timeout: 2000
      # 统一会话时区，避免 TIMESTAMP / CURRENT_TIMESTAMP 在 +08 服务器上
      # 被当成 UTC 读出 8 小时偏移。源码快照的 updatedAt 依赖此设置。
      connection-init-sql: SET time_zone = '+00:00'

  # 复用 ~/Workspace/infra 的 Redis。
  data:
    redis:
      host: ${REDIS_HOST:host.docker.internal}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s
      connect-timeout: 2s

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

  # 项目导入：zip / 截图最大 32MB（Python 侧还有更细的解压体积限制）。
  servlet:
    multipart:
      max-file-size: 32MB
      max-request-size: 34MB

# Python AI Core 内部调用地址。
# 容器内使用 Docker 自定义网络的服务名 python-ai；本地 IDE 调试可改为 http://localhost:8100。
ai-core:
  base-url: ${AI_CORE_BASE_URL:http://localhost:8100}
  connect-timeout-ms: ${AI_CORE_CONNECT_TIMEOUT_MS:2000}
  read-timeout-ms: ${AI_CORE_READ_TIMEOUT_MS:3000}
  # 交互式代理：Supervisor / Architect 状态操作，不承载分钟级生成。
  interactive-connect-timeout-ms: ${AI_CORE_INTERACTIVE_CONNECT_TIMEOUT_MS:2000}
  interactive-read-timeout-ms: ${AI_CORE_INTERACTIVE_READ_TIMEOUT_MS:15000}
  # Run 执行是同步长请求：模型调用 + 沙盒构建 + 最多 3 次修复。
  run-connect-timeout-ms: ${AI_CORE_RUN_CONNECT_TIMEOUT_MS:2000}
  run-read-timeout-ms: ${AI_CORE_RUN_READ_TIMEOUT_MS:300000}
  # 舱壁 + 熔断：下游变慢时最多占满 N 个线程，其余接口保持可用。
  resilience:
    enabled: ${AI_CORE_RESILIENCE_ENABLED:true}
    short-max-concurrent: ${AI_CORE_SHORT_MAX_CONCURRENT:64}
    short-acquire-timeout-ms: ${AI_CORE_SHORT_ACQUIRE_TIMEOUT_MS:0}
    interactive-max-concurrent: ${AI_CORE_INTERACTIVE_MAX_CONCURRENT:64}
    interactive-acquire-timeout-ms: ${AI_CORE_INTERACTIVE_ACQUIRE_TIMEOUT_MS:0}
    run-max-concurrent: ${AI_CORE_RUN_MAX_CONCURRENT:48}
    run-acquire-timeout-ms: ${AI_CORE_RUN_ACQUIRE_TIMEOUT_MS:0}
    failure-threshold: ${AI_CORE_FAILURE_THRESHOLD:4}
    open-duration-ms: ${AI_CORE_OPEN_DURATION_MS:15000}
    half-open-max-calls: ${AI_CORE_HALF_OPEN_MAX_CALLS:2}

# MinIO 仅做客户端配置，M1 启动时懒连接。
minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:admin}
  secret-key: ${MINIO_SECRET_KEY:admin123}
  bucket: ${MINIO_BUCKET:vibe-platform}
  secure: ${MINIO_SECURE:false}

# 管理中台（M3.1）
platform:
  admin:
    # 本地演示：内存中还没有真实 Run 时预置样例看板数据；响应会带 demo=true。
    # 生产环境必须保持 false。
    demo-seed: ${ADMIN_METRICS_DEMO_SEED:false}

info:
  app:
    name: java-bff
    version: 0.1.0

logging:
  level:
    root: INFO
    com.vibeplatform.bff: INFO
