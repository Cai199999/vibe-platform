<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vibe Sandbox</title>
    <style>
      /* 画布 / 预览使用固定 1440×900 逻辑视口；页面内容更高时
         必须允许文档真实滚动，否则底部内容永远看不到。 */
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      /* 文档根节点承担滚动条：body / #root 保持 100% 高度但不要各自
         再开一个内层滚动容器，否则 window.scrollY 会恒为 0，双屏同步
         与 SDK 滚动快照都会失效。 */
      html {
        overflow-y: auto;
        overflow-x: hidden;
        scrollbar-gutter: stable;
      }

      html,
      body,
      #root {
        width: 100%;
        height: 100%;
        min-height: 100%;
        margin: 0;
        padding: 0;
        background: #0f172a;
        color: #e2e8f0;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
