- id: "case_007"
  name: "Both：UI 改色 + 全栈架构同时规划"
  tags: ["supervisor", "both", "smoke"]
  input:
    target_agent: "auto"
    fixture: "react_dashboard"
    text: "把按钮改成蓝色，同时规划全栈后端和数据库"
    annotation:
      annotationId: "ann_eval_007"
      type: "note"
      action: "MODIFY"
      target:
        mode: "source"
        selector: "[data-source='primary-action']"
        source:
          file: "src/App.jsx"
          component: "PrimaryButton"
      payload:
        text: "改成蓝色"
  assertions:
    expected_handoff: "handoff_both"
    expected_agent: "both"
    expected_task_type: "combined"
    expected_dispatchable: true
    # both 必须先 Architect 冻结契约，再启动 UI。
    expected_handoffs: ["architect_graph", "ui_graph"]
    expected_code_contains: ["background-color:blue"]

- id: "case_008"
  name: "CustomAgent：销售数据 Excel 报表"
  tags: ["custom-agent", "routing"]
  input:
    target_agent: "auto"
    text: "帮我导出一份本月的销售数据"
  assertions:
    expected_handoff: "handoff_custom"
    expected_agent: "excel_report_agent"
    expected_task_type: "excel_report_generation"
    expected_dispatchable: false
    expected_handoffs: ["excel_report_agent"]
    expected_missing_inputs: ["customAgentRuntime"]

- id: "case_009"
  name: "UI 守卫：缺少画布标注不可派发"
  tags: ["guard", "ui", "negative"]
  input:
    target_agent: "auto"
    text: "把按钮改成红色"
  assertions:
    expected_handoff: "handoff_ui"
    expected_agent: "ui_graph"
    expected_task_type: "ui_local_edit"
    expected_dispatchable: false
    expected_handoffs: ["ui_graph"]
    expected_missing_inputs: ["annotations"]

- id: "case_010"
  name: "兜底：无法识别意图时拒绝路由"
  tags: ["guard", "negative"]
  input:
    target_agent: "auto"
    text: "今天天气怎么样"
  assertions:
    expected_handoff: "rejected"
    expected_agent: "none"
    expected_task_type: "unknown"
    expected_dispatchable: false
    expected_handoffs: []
    expected_missing_inputs: ["明确意图", "annotations"]
