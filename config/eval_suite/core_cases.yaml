# ============================================================
# vibe-platform 核心评测集（Eval Suite）
#
# 设计原则：
#   1. 离线、确定性、零密钥：默认使用 AI Core 的 MockAgentLLM，
#      不启动 Docker 沙盒、不访问网络，适合本地与 CI 每次提交运行。
#   2. 一条用例只验证一个明确契约：路由（Supervisor）+ 代码结果（Mock 生成）。
#   3. expected_code_contains 是“生成代码中必须出现的稳定片段”，
#      不是整段代码快照，避免无关格式变化导致误报。
#
# 运行：
#   ./scripts/eval_suite.sh run
#   ./scripts/eval_suite.sh list
#   ./scripts/eval_suite.sh validate
# ============================================================

- id: "case_001"
  name: "UI 修改：将按钮变红"
  tags: ["ui", "style", "smoke"]
  input:
    target_agent: "auto"
    fixture: "react_dashboard"
    text: "改成红色"
    annotation:
      annotationId: "ann_eval_001"
      type: "note"
      action: "MODIFY"
      target:
        mode: "source"
        selector: "[data-source='primary-action']"
        source:
          file: "src/App.jsx"
          component: "PrimaryButton"
      payload:
        text: "改成红色"
  assertions:
    expected_handoff: "handoff_ui"
    expected_agent: "ui_graph"
    expected_task_type: "ui_local_edit"
    expected_dispatchable: true
    expected_handoffs: ["ui_graph"]
    expected_code_contains: ["background-color:red"]

