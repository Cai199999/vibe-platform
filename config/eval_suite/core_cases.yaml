- id: "case_005"
  name: "UI 批量修改：颜色 + 文案一次提交"
  tags: ["ui", "multi-annotation", "smoke"]
  input:
    target_agent: "auto"
    fixture: "react_dashboard"
    text: "把按钮改成蓝色，标题改成限时优惠"
    annotations:
      - annotationId: "ann_eval_005a"
        type: "note"
        action: "MODIFY"
        target:
          mode: "source"
          selector: "[data-source='primary-action']"
          source:
            file: "src/App.jsx"
            component: "PrimaryButton"
        payload:
          text: "改成蓝色"
      - annotationId: "ann_eval_005b"
        type: "note"
        action: "MODIFY"
        target:
          mode: "source"
          selector: "[data-source='hero-title']"
          source:
            file: "src/App.jsx"
            component: "HeroTitle"
        payload:
          text: "标题改成限时优惠"
  assertions:
    expected_handoff: "handoff_ui"
    expected_agent: "ui_graph"
    expected_task_type: "ui_local_edit"
    expected_dispatchable: true
    expected_handoffs: ["ui_graph"]
    expected_code_contains: ["background-color:blue", "限时优惠"]

